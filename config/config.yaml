database:
  path: "data/knowledge_base.db"

ollama:
  base_url: "http://localhost:11434"
  model_name: "deepseek-r1:8b"  # 可修改为任何已安装的Ollama模型名称
  timeout: 120

scraper:
  timeout: 10
  max_content_length: 50000
  max_links: 100
  max_concurrent: 5  # 异步并发数

file_indexer:
  supported_extensions:
    - ".txt"
    - ".md"
    - ".py"
    - ".js"
    - ".html"
    - ".css"
    - ".json"
    - ".xml"
    - ".csv"
    - ".log"
    - ".yaml"
    - ".yml"
  max_content_length: 100000
  check_interval: 60  # 增量检查间隔（秒）

vector_search:
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"  # 支持中文
  embedding_dim: 384
  index_type: "faiss"  # faiss or flat
  top_k: 5
  # 分块嵌入策略
  chunking:
    enabled: true  # 是否启用分块嵌入
    strategy: "smart"  # smart: 智能分块, semantic: 语义分块, fixed: 固定大小分块
    # 智能分块配置
    smart:
      min_chunk_size: 200  # 最小块大小（字符）
      max_chunk_size: 1000  # 最大块大小（字符）
      paragraph_delimiters: ["\n\n", "\r\n\r\n"]  # 段落分隔符
    # 语义分块配置（降级方案）
    semantic:
      chunk_size: 500  # 每块字符数
      overlap: 100  # 块间重叠字符数
    # 固定分块配置（最终降级方案）
    fixed:
      chunk_size: 512  # 固定块大小（字符）
      overlap: 50  # 块间重叠字符数

search:
  max_results: 5
  max_context_length: 2000

